# Orchestrator (P2a: authored, NOT yet run against a remote; enabling it is P2b = OWNER_APPROVAL_REQUIRED).
#
# When CI completes, this job delivers the workflow_run payload to the control plane. Per spec D1 the
# control plane is GitHub-native (state lives in this repo), so "POST the event to the control plane"
# = run `node src/cli.js ingest` on the event file, then commit the new state back.
#
# Single writer:
#   1. `concurrency` below: only one orchestrator run at a time, queued runs are not cancelled.
#   2. optimistic lock: the state commit is pushed on top of the sha we checked out; if anyone else
#      moved main, the push is rejected and the run fails without writing (re-run = re-read).
#
# Untrusted input: the webhook payload is only ever read from $GITHUB_EVENT_PATH by the adapter.
# No `${{ github.event.* }}` expression is interpolated into a shell command (script injection).
name: Orchestrator

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: clubOrchestra
  cancel-in-progress: false

permissions:
  contents: write # commit control-plane state (data/) back to main

jobs:
  ingest:
    # Ignore CI runs from forks.
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # P2b: pin third-party actions to full commit SHAs before enabling.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch task branch heads (exact-SHA gate reads them from .git)
        run: git fetch --no-tags origin '+refs/heads/co/*:refs/heads/co/*'
      - name: Ingest workflow_run into the control plane
        env:
          REPO: ${{ github.repository }}
        run: node src/cli.js ingest data "$GITHUB_EVENT_PATH" --git-dir .git --repo "$REPO"
      # P2b: turn data/outbox/<task_id>.json into a repository_dispatch to the worker workflow.
      - name: Commit state (optimistic lock via non-forced push)
        run: |
          git config user.name "clubOrchestra"
          git config user.email "orchestra@club.is"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "orchestrator: ingest workflow_run ${GITHUB_RUN_ID}"
          git push origin HEAD:main
