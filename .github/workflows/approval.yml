# Approval: the owner answers an owner-decision issue with /approve or /deny.
#
# Runs only from the default branch (issue_comment), so it takes effect after merge into main.
# The repository is PUBLIC: anyone can comment, so the rules live in src/ownerCommands.js and are
# tested there. A comment counts only from an allowlisted approver with author_association OWNER, on an
# issue opened by the clubOrchestra bot (hidden approval-id marker, recorded in our outbox), for a still
# pending approval, with `/approve` or `/deny` as the exact first line. Everything else is ignored and
# audit-logged, with no reply.
#
# Safety:
#   - permissions: issues: write + contents: write, nothing else; no secrets, no API keys
#   - never pull_request_target; issue comments on pull requests are skipped
#   - comment and issue text never reach a shell (the CLI reads $GITHUB_EVENT_PATH; this file only
#     reads our own result files) and never reach the planner or worker
#   - same concurrency group as the orchestrator: both write orchestra-state
name: Approval

on:
  issue_comment:
    types: [created]

concurrency:
  group: clubOrchestra
  cancel-in-progress: false

permissions:
  issues: write # reply to and close the decided issue
  contents: write # record the decision in data/approvals on orchestra-state

jobs:
  decide:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out control-plane code (main)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - name: Check out state (orchestra-state)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: orchestra-state
          path: state
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Evaluate the comment (the event file is data; nothing from it reaches the shell)
        run: node src/cli.js owner-command state/data "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/owner-command"
      - name: Record the decision on orchestra-state (non-forced push)
        working-directory: state
        run: |
          git config user.name "clubOrchestra"
          git config user.email "337842026+cluborchestra@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "approval: owner command ${GITHUB_RUN_ID}"
          git push origin HEAD:orchestra-state
      - name: Reply and close (valid owner commands only)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          out="$RUNNER_TEMP/owner-command"
          [ -f "$out.reply.md" ] || exit 0
          num=$(cat "$out.issue")
          case "$num" in ''|*[!0-9]*) echo "bad issue number"; exit 1 ;; esac
          gh issue comment "$num" --body-file "$out.reply.md"
          if [ -f "$out.close" ]; then gh issue close "$num"; fi
