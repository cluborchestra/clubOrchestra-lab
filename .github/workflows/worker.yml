# Worker (P3 Lot 3 skeleton): installs the pinned Claude Code CLI and verifies the exact version.
#
# NOT ENABLED. The job runs only if the repository variable WORKER_ENABLED is exactly "true" (unset
# today), and only on repository_dispatch (runs on the default branch). It has no secrets and makes no
# model call. Lot 3 adds the environment `agents-worker` (ANTHROPIC_API_KEY, reviewer gate) and the
# real worker step, after the Product Owner's approval.
#
# CLI pin: npm package @anthropic-ai/claude-code at exactly 2.1.286 (the same value as
# config/agent-limits.json claude_code.version; a test keeps the two equal). The step after the
# install fails closed unless `claude --version` prints exactly "2.1.286 (Claude Code)".
name: Worker

on:
  repository_dispatch:
    types: [co-worker]

permissions:
  contents: read

jobs:
  worker:
    if: vars.WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out control-plane code (main)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install Claude Code CLI (exact pin 2.1.286)
        run: npm install -g --no-audit --no-fund @anthropic-ai/claude-code@2.1.286
      - name: Verify the exact CLI version (fail closed)
        run: node src/cli.js check-claude-version "$(claude --version)"
      - name: Worker run (P3 Lot 3, not wired)
        run: |
          echo "Lot 3 is not wired: no worker run and no model call."
          exit 1
