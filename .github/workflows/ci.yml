# CI: runs the test suite on every push to a task branch (co/<task_id>) and on pull requests.
# Completion of a co/* push run fires orchestrator.yml via workflow_run (the orchestrator itself
# stays disabled until the repository variable ORCHESTRATOR_ENABLED is "true").
name: CI

on:
  push:
    branches: ['co/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # devDependencies only (openai SDK as the test judge); lockfile-exact, no install scripts.
      - run: npm ci --ignore-scripts
      - run: npm test
